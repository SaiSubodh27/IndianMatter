services:
  mongodb:
    image: mongo:7.0
    container_name: indianmatter-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: IndianMaterialsAI
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - indianmatter-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: indianmatter-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongodb:27017/IndianMaterialsAI
      - PORT=8000
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./property_prediction_models:/app/property_prediction_models
    networks:
      - indianmatter-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: indianmatter-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_TOPATH_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - indianmatter-network

volumes:
  mongodb_data:
    driver: local

networks:
  indianmatter-network:
    driver: bridge
